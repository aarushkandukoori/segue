<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The production policy (SPEC 6, index.html) plus a nonce for this page's inline module, so the e2e
         proves that the relays, oEmbed and the Spotify reader are all reachable under it. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://api.deezer.com https://www.youtube.com 'nonce-ytharness'; connect-src 'self' https:; img-src 'self' https: data: blob:; media-src blob:; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; frame-src https://www.youtube-nocookie.com https://www.youtube.com; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Segue · YouTube finder harness</title>
  </head>
  <body>
    <p>YouTube finder e2e harness — driven by tests/e2e/youtube.e2e.mjs (real network, no player).</p>
    <script type="module" nonce="ytharness">
      import * as index from '../../js/sources/index.js';
      import * as youtube from '../../js/sources/youtube.js';
      import * as util from '../../js/sources/util.js';

      const errInfo = (e) => ({ name: e && e.name, code: e && e.code, message: e && e.message, detail: e && e.detail });

      /** Run fn, return {ok, value | error, ms}. Results must survive JSON serialisation. */
      async function timed(fn) {
        const t0 = performance.now();
        try {
          const value = await fn();
          return { ok: true, value, ms: Math.round(performance.now() - t0) };
        } catch (e) {
          return { ok: false, error: errInfo(e), ms: Math.round(performance.now() - t0) };
        }
      }

      /** One relay, one query, measured from this origin: status, bytes, time, how many videos parsed. */
      async function probeRelay(name, query) {
        const relay = youtube.YT_RELAYS.find((r) => r.name === name);
        const req = relay.build(youtube.searchUrl(query));
        const t0 = performance.now();
        try {
          const res = await util.request(req.url, { headers: req.headers, as: 'text', timeoutMs: 20000, maxBytes: 3 * 1024 * 1024 });
          const t1 = performance.now();
          const page = youtube.readSearchPage(res.body);
          return { ok: res.ok && page.candidates.length > 0, status: res.status, bytes: (res.body || '').length, ms: Math.round(t1 - t0), parseMs: Math.round(performance.now() - t1), found: page.found, videos: page.candidates.length };
        } catch (e) {
          return { ok: false, status: 0, error: errInfo(e), ms: Math.round(performance.now() - t0) };
        }
      }

      /**
       * The oEmbed endpoint as the finder sees it: is the status of a refusal readable cross-origin, and is
       * the body of an answer (the real title and channel the finder checks a relay's claim against)?
       */
      async function oembedStatus(id) {
        const url = `https://www.youtube.com/oembed?url=${encodeURIComponent(`https://www.youtube.com/watch?v=${id}`)}&format=json`;
        try {
          const res = await util.request(url, { as: 'text', timeoutMs: 8000, maxBytes: 65536 });
          let body = null;
          try {
            body = JSON.parse(res.body);
          } catch {}
          return { status: res.status, title: !!body && typeof body.title === 'string' && body.title.length > 0, author: !!body && typeof body.author_name === 'string' && body.author_name.length > 0 };
        } catch (e) {
          return { status: 0, error: errInfo(e) };
        }
      }

      /**
       * A finder whose relay answers are made up (one videoRenderer per search, from `claim`) while oEmbed is
       * the real one: does YouTube's own answer refute a relay that lies about which video carries which title?
       */
      async function withFakeRelay(track, claim) {
        let oembeds = 0;
        let searches = 0;
        const M = 'ytInitial' + 'Data';
        const fetchText = async (url, opts) => {
          if (/^https:\/\/www\.youtube\.com\/oembed/.test(url)) {
            oembeds++;
            return util.request(url, { signal: opts.signal, timeoutMs: opts.timeoutMs, as: 'text', maxBytes: opts.maxBytes });
          }
          searches++;
          const vr = { videoId: claim.videoId, title: { runs: [{ text: claim.title }] }, ownerText: { runs: [{ text: claim.channel }] }, lengthText: { simpleText: claim.length } };
          if (claim.badge) vr.ownerBadges = [{ metadataBadgeRenderer: { style: claim.badge } }];
          const data = { contents: [{ videoRenderer: vr }] };
          return { status: 200, ok: true, body: JSON.stringify({ result: { script: ['var ' + M + ' = ' + JSON.stringify(data) + ';'] } }) };
        };
        const finder = youtube.createYouTubeFinder({ fetchText, storage: null, hedgeMs: 0 });
        const r = await timed(() => finder.find(track));
        const s = finder.stats();
        return { ...r, oembeds, searches, mismatch: s.oembedMismatch };
      }

      /** Longest stretch (ms) in which a 10 ms timer could not run while `fn` was busy. */
      async function frozenDuring(fn) {
        let last = performance.now();
        let worst = 0;
        const id = setInterval(() => {
          const now = performance.now();
          worst = Math.max(worst, now - last);
          last = now;
        }, 10);
        await new Promise((r) => setTimeout(r, 30));
        const out = fn();
        await new Promise((r) => setTimeout(r, 30));
        clearInterval(id);
        return { worst: Math.round(worst), out };
      }

      window.H = { index, youtube, util, timed, probeRelay, oembedStatus, withFakeRelay, frozenDuring, errInfo };
      window.harnessReady = true;
    </script>
  </body>
</html>
