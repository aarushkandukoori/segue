<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex">
    <title>Segue — social card source (rendered to og.png by tests/e2e/ui.e2e.mjs --assets)</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,100..900&family=Instrument+Sans:wght@400..700&family=Martian+Mono:wdth,wght@75..112.5,100..800&display=swap">
    <link rel="stylesheet" href="../css/style.css">
    <style>
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      .card { position: relative; width: 1200px; height: 630px; background: #09090b; overflow: hidden; }
      .glow { position: absolute; inset: 0; background:
        radial-gradient(620px 420px at 0% 108%, rgba(255, 122, 60, 0.36), transparent 70%),
        radial-gradient(620px 420px at 100% 108%, rgba(63, 210, 255, 0.34), transparent 70%); }
      .card .grain { position: absolute; z-index: 0; }
      .top { position: absolute; left: 56px; right: 56px; top: 44px; display: flex; align-items: center; justify-content: space-between; }
      .top .wordmark { font-size: 26px; gap: 13px; }
      .top .wordmark .mark { width: 36px; height: 36px; }
      .top p { font: 500 15px/1 var(--f-mono); color: var(--ink-2); letter-spacing: 0.02em; }
      h1 { position: absolute; left: 54px; top: 122px; margin: 0; font: 900 84px/0.92 var(--f-display); font-stretch: 150%; letter-spacing: -0.012em; text-transform: uppercase; white-space: nowrap; }
      h1 span { display: block; }
      h1 .o { color: transparent; -webkit-text-stroke: 1.6px var(--ink-2); }
      .tag { position: absolute; left: 58px; top: 300px; max-width: 1040px; font: 500 25px/1.2 var(--f-body); color: var(--ink-2); }
      .tag b { color: var(--ink); font-weight: 600; }
      .wave { position: absolute; left: 0; right: 0; bottom: 0; height: 236px; background: #050506; border-top: 1px solid var(--line-2); }
      .wave canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      .wave .lock { position: absolute; right: 56px; top: 50%; transform: translateY(-50%); font-size: 12px; padding: 7px 12px 7px 10px; }
      .wave .tagc { position: absolute; left: 56px; display: inline-flex; align-items: center; gap: 9px; padding: 4px 11px 4px 4px; border-radius: 8px; background: rgba(5, 5, 6, 0.8); font: 500 13px/1 var(--f-mono); color: var(--ink); }
      .wave .tagc b { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; color: #0b0a0c; font: 900 13px/1 var(--f-display); }
      .wave .ta { top: 12px; } .wave .ta b { background: var(--a); }
      .wave .tb { bottom: 12px; } .wave .tb b { background: var(--b); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="glow"></div>
      <div class="grain"></div>
      <div class="top">
        <span class="wordmark">
          <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M14.6 3.1a13 13 0 0 0 0 25.8z" fill="#ff7a3c"/><path d="M17.4 3.1a13 13 0 0 1 0 25.8z" fill="#3fd2ff"/><circle cx="16" cy="16" r="4.4" fill="#09090b"/></svg>
          <span>Segue</span>
        </span>
        <p>Paste a Spotify playlist. Press play.</p>
      </div>
      <h1><span class="o">Your playlist,</span><span>DJ’d live.</span></h1>
      <p class="tag"><b>Never the same set twice.</b> Beat-matched blends, bass swaps and drops — mixed live in your browser.</p>
      <div class="wave">
        <canvas id="c"></canvas>
        <span class="tagc ta"><b>A</b>124.0 BPM · 8A</span>
        <span class="tagc tb"><b>B</b>126.0 → 124.0 BPM · 9A</span>
        <span class="lock is-on"><i></i><span>Beat lock</span></span>
      </div>
    </div>
    <script type="module">
      import { createWaves } from '../js/ui/waves.js';
      import { makeTrack } from '../js/ui/mock.js';
      const canvas = document.getElementById('c');
      const waves = createWaves(canvas, { labels: false, pxPerSec: () => 100 });
      const a = makeTrack({ seed: 11, bpm: 124, duration: 60, club: true });
      const b = makeTrack({ seed: 29, bpm: 126, duration: 60, firstBeat: 0.31, club: true });
      waves.resize(1200, 236, 1);
      waves.setDeck(0, a);
      waves.setDeck(1, b);
      // both decks on a downbeat, beat-matched: deck B pitched down to deck A's tempo
      const posA = a.beats[36];
      const posB = b.beats[44];
      waves.draw({ pos: posA + 0.11, audible: 1, rate: 1 }, { pos: posB + 0.11 * (124 / 126), audible: 1, rate: 124 / 126 }, 0.2);
      document.fonts.ready.then(() => { document.documentElement.dataset.ready = '1'; });
    </script>
  </body>
</html>
